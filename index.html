<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصال التردد اللاسلكي - Online Walkie Talkie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .frequency-display {
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
            font-family: 'Courier New', Courier, monospace;
        }
        .status-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .dial-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            background: #22d3ee;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.8);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-8 shadow-2xl border border-slate-700 relative overflow-hidden">
        <!-- Background Glow -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl"></div>
        
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-cyan-400 mb-2">راديو الشبكة المباشر</h1>
            <p class="text-slate-400 text-sm">اضبط التردد للتحدث مع الآخرين</p>
        </header>

        <!-- Frequency Screen -->
        <div class="bg-black/40 rounded-2xl p-6 border border-slate-600 mb-8 text-center">
            <div class="text-xs text-cyan-500 mb-1 font-bold uppercase tracking-widest">Frequency MHz</div>
            <div id="freqValue" class="text-5xl font-bold frequency-display text-cyan-400">50.00</div>
            <div id="connectionStatus" class="mt-4 text-xs text-slate-500 flex items-center justify-center gap-2">
                <span class="w-2 h-2 bg-slate-500 rounded-full"></span>
                غير متصل
            </div>
        </div>

        <!-- Controls -->
        <div class="space-y-6">
            <div>
                <input type="range" id="freqSlider" min="10" max="100" step="0.01" value="50.00" 
                       class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer dial-range">
                <div class="flex justify-between text-[10px] text-slate-500 mt-2 px-1 font-mono">
                    <span>10.00 MHz</span>
                    <span>100.00 MHz</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button id="connectBtn" class="bg-cyan-600 hover:bg-cyan-500 transition-colors py-4 rounded-xl font-bold flex flex-col items-center gap-1 shadow-lg shadow-cyan-900/20">
                    <i class="fas fa-tower-broadcast"></i>
                    <span>دخول التردد</span>
                </button>
                <button id="micBtn" disabled class="bg-slate-700 text-slate-500 py-4 rounded-xl font-bold flex flex-col items-center gap-1 cursor-not-allowed">
                    <i id="micIcon" class="fas fa-microphone-slash"></i>
                    <span id="micText">الميكروفون مغلق</span>
                </button>
            </div>
        </div>

        <!-- Participants Info -->
        <div id="activeList" class="mt-8 pt-6 border-t border-slate-700 hidden">
            <h3 class="text-xs font-bold text-slate-500 mb-4 uppercase">المتصلون الآن بنفس التردد:</h3>
            <div id="peersContainer" class="space-y-2">
                <!-- Peers will appear here -->
            </div>
        </div>
    </div>

    <!-- Instructions -->
    <div class="mt-8 max-w-md text-center text-slate-500 text-sm">
        <p><i class="fas fa-info-circle ml-1"></i> ملاحظة: يجب أن يتواجد الأشخاص على نفس الرقم الدقيق (مثلاً 100.00) ليسمعوا بعضهم البعض.</p>
    </div>

    <!-- Audio elements container -->
    <div id="audioContainer"></div>

    <script>
        const freqSlider = document.getElementById('freqSlider');
        const freqValue = document.getElementById('freqValue');
        const connectBtn = document.getElementById('connectBtn');
        const micBtn = document.getElementById('micBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const activeList = document.getElementById('activeList');
        const peersContainer = document.getElementById('peersContainer');
        const audioContainer = document.getElementById('audioContainer');

        let peer = null;
        let myStream = null;
        let currentFreq = "50.00";
        let isConnected = false;

        // Update display on slider change
        freqSlider.addEventListener('input', (e) => {
            currentFreq = parseFloat(e.target.value).toFixed(2);
            freqValue.innerText = currentFreq;
            if (isConnected) {
                // If frequency changes while connected, we need to reconnect
                disconnect();
            }
        });

        async function initCall() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                updateStatus("متصل بالتردد", "text-green-400", "bg-green-400 status-pulse");
                micBtn.disabled = false;
                micBtn.classList.replace('bg-slate-700', 'bg-red-600');
                micBtn.classList.replace('text-slate-500', 'text-white');
                micBtn.classList.remove('cursor-not-allowed');
                document.getElementById('micIcon').className = 'fas fa-microphone';
                document.getElementById('micText').innerText = 'تحدث الآن';
                
                // Create Peer ID based on frequency
                // Note: PeerJS IDs must be unique. In a real app, you'd use a server to list peers.
                // For this demo, we use a prefix + random string.
                const randomId = Math.random().toString(36).substring(7);
                const peerId = `freq-${currentFreq.replace('.', '-')}-${randomId}`;
                
                peer = new Peer(peerId);

                peer.on('open', (id) => {
                    console.log('My peer ID is: ' + id);
                    activeList.classList.remove('hidden');
                    // In a simple PeerJS setup without a backend, we can't easily "list" others on the same frequency
                    // So we simulate discovery or wait for calls.
                    // Ideally, you'd use a signaling server to find everyone with "freq-X-Y" prefix.
                });

                peer.on('call', (call) => {
                    call.answer(myStream);
                    handleCall(call);
                });

            } catch (err) {
                console.error('Failed to get local stream', err);
                alert('يرجى السماح بالوصول للميكروفون للتمكن من الاتصال.');
            }
        }

        function handleCall(call) {
            call.on('stream', (remoteStream) => {
                const audioId = `audio-${call.peer}`;
                if (!document.getElementById(audioId)) {
                    const audio = document.createElement('audio');
                    audio.id = audioId;
                    audio.srcObject = remoteStream;
                    audio.autoplay = true;
                    audioContainer.appendChild(audio);
                    
                    addPeerToUI(call.peer);
                }
            });
        }

        function addPeerToUI(peerId) {
            const el = document.createElement('div');
            el.className = 'flex items-center justify-between bg-slate-700/50 p-3 rounded-lg border border-slate-600';
            el.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-cyan-900 rounded-full flex items-center justify-center text-cyan-400">
                        <i class="fas fa-user text-xs"></i>
                    </div>
                    <span class="text-xs font-mono">مستخدم مجهول</span>
                </div>
                <span class="text-[10px] text-green-500 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-ping"></span>
                    مباشر
                </span>
            `;
            peersContainer.appendChild(el);
        }

        function updateStatus(text, textColor, dotClass) {
            connectionStatus.innerHTML = `<span class="w-2 h-2 ${dotClass} rounded-full"></span> ${text}`;
            connectionStatus.className = `mt-4 text-xs ${textColor} flex items-center justify-center gap-2`;
        }

        function disconnect() {
            if (peer) peer.destroy();
            if (myStream) {
                myStream.getTracks().forEach(track => track.stop());
            }
            isConnected = false;
            connectBtn.innerText = 'دخول التردد';
            connectBtn.classList.replace('bg-red-900', 'bg-cyan-600');
            updateStatus("غير متصل", "text-slate-500", "bg-slate-500");
            activeList.classList.add('hidden');
            peersContainer.innerHTML = '';
            audioContainer.innerHTML = '';
            micBtn.disabled = true;
            micBtn.className = "bg-slate-700 text-slate-500 py-4 rounded-xl font-bold flex flex-col items-center gap-1 cursor-not-allowed";
        }

        connectBtn.addEventListener('click', () => {
            if (!isConnected) {
                isConnected = true;
                connectBtn.innerHTML = '<i class="fas fa-sign-out-alt"></i><span>خروج</span>';
                connectBtn.classList.replace('bg-cyan-600', 'bg-red-900');
                initCall();
            } else {
                disconnect();
            }
        });
    </script>
</body>
</html>
