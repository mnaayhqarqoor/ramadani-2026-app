<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeChat Pro | المحادثة الآمنة</title>
    <style>
        /* إعدادات الألوان والخلفية */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent-color: #00f2fe;
            --admin-glow: #ff416c;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-attachment: fixed;
            overflow: hidden;
        }

        /* تأثير الزجاج (Glassmorphism) */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* شاشة الدخول */
        #login-screen {
            width: 350px;
            padding: 40px;
            text-align: center;
            color: white;
            transition: 0.5s;
        }

        #login-screen h2 { margin-bottom: 25px; font-weight: 300; letter-spacing: 2px; }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent-color); background: rgba(255, 255, 255, 0.2); }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4); }

        /* واجهة المحادثة - للحاسوب والهاتف */
        #chat-screen {
            display: none;
            width: 95%;
            max-width: 900px;
            height: 85vh;
            flex-direction: column;
        }

        #chat-header {
            padding: 15px 25px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* فقاعات الرسائل */
        .message {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            color: white;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border-bottom-right-radius: 2px;
        }

        .admin-msg {
            align-self: flex-end;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border-bottom-left-radius: 2px;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
        }

        .meta { font-size: 0.7rem; opacity: 0.7; margin-bottom: 4px; display: block; }

        /* منطقة الإدخال */
        .input-bar {
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--glass-border);
        }

        #msg-input { margin: 0; }

        /* تخصيص السكرول بار */
        #messages::-webkit-scrollbar { width: 5px; }
        #messages::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        /* استجابة للهواتف */
        @media (max-width: 600px) {
            #chat-screen { height: 100vh; width: 100%; border-radius: 0; border: none; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>

    <div id="login-screen" class="glass-panel">
        <h2>SafeChat</h2>
        <p style="font-size: 0.8rem; opacity: 0.8;">أدخل بياناتك للبدء</p>
        <input type="text" id="username" placeholder="الاسم المستعار (أو Admin للتميز)">
        <input type="password" id="secret-code" placeholder="رمز الدخول">
        <button onclick="login()">دخول آمن</button>
    </div>

    <div id="chat-screen" class="glass-panel">
        <div id="chat-header">
            <span id="display-name" style="font-weight: bold;">المحادثة الجماعية</span>
            <span style="font-size: 0.8rem; color: var(--accent-color);">● متصل الآن</span>
        </div>
        
        <div id="messages">
            </div>

        <div class="input-bar">
            <input type="text" id="msg-input" placeholder="اكتب رسالتك المشفرة...">
            <button onclick="sendMessage()" style="width: auto; padding: 0 25px; margin: 0;">إرسال</button>
        </div>
    </div>

    <script>
        let user = "";
        let isAdmin = false;

        function login() {
            const nameInput = document.getElementById('username');
            const codeInput = document.getElementById('secret-code');

            if (codeInput.value === "1234" && nameInput.value.trim() !== "") {
                user = nameInput.value;
                isAdmin = user.toLowerCase().includes("admin");
                
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                document.getElementById('display-name').innerText = "أهلاً، " + user;
            } else {
                alert("بيانات الدخول غير صحيحة!");
            }
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isAdmin ? 'admin-msg' : 'user-msg'}`;
            
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            msgDiv.innerHTML = `
                <span class="meta">${user} • ${time} ${isAdmin ? '[MOD]' : ''}</span>
                <div>${text}</div>
            `;

            const container = document.getElementById('messages');
            container.appendChild(msgDiv);
            input.value = "";
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('msg-input').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
