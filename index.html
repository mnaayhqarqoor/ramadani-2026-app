<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصال التردد اللاسلكي - المطور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: sans-serif; }
        .frequency-display { text-shadow: 0 0 20px rgba(34, 211, 238, 0.5); font-family: monospace; }
        .dial-range::-webkit-slider-thumb { -webkit-appearance: none; width: 25px; height: 25px; background: #22d3ee; border-radius: 50%; }
        .animate-pulse-fast { animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-8 shadow-2xl border border-slate-700 relative">
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-cyan-400 mb-2">راديو الشبكة الذكي</h1>
            <p class="text-slate-400 text-xs">نظام الربط التلقائي الفعال</p>
        </header>

        <div class="bg-black/40 rounded-2xl p-6 border border-slate-600 mb-8 text-center">
            <div class="text-[10px] text-cyan-500 mb-1 font-bold tracking-widest uppercase">Target Frequency</div>
            <input type="number" id="freqInput" step="0.01" min="10" max="100" value="50.00" 
                   class="bg-transparent text-5xl font-bold frequency-display text-cyan-400 w-full text-center outline-none">
            <div id="connectionStatus" class="mt-4 text-xs flex items-center justify-center gap-2">
                <span id="statusDot" class="w-2 h-2 bg-slate-500 rounded-full"></span>
                <span id="statusText" class="text-slate-500">جاهز للبدء</span>
            </div>
        </div>

        <div class="space-y-6">
            <input type="range" id="freqSlider" min="10" max="100" step="0.01" value="50.00" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer dial-range">
            
            <button id="connectBtn" class="w-full bg-cyan-600 hover:bg-cyan-500 py-5 rounded-2xl font-bold flex flex-row justify-center items-center gap-3 transition-all transform active:scale-95 shadow-lg shadow-cyan-900/40">
                <i class="fas fa-tower-broadcast text-xl" id="connectIcon"></i>
                <span id="connectText">دخول التردد الآن</span>
            </button>
        </div>

        <div id="activeList" class="mt-8 pt-6 border-t border-slate-700 hidden">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-[10px] font-bold text-slate-500 uppercase">المستمعون النشطون:</h3>
                <span id="scannerLabel" class="text-[9px] text-cyan-500 animate-pulse">جاري البحث عن رفاق...</span>
            </div>
            <div id="peersContainer" class="space-y-2"></div>
        </div>
    </div>

    <div class="mt-8 text-slate-500 text-[11px] text-center space-y-1">
        <p><i class="fas fa-check-circle text-green-500 ml-1"></i> الحل الجديد: يقوم التطبيق الآن "بالهجوم" والبحث عن أصدقائك تلقائياً.</p>
        <p>تأكد من فتح الرابط بـ <strong>HTTPS</strong> لتفعيل الميكروفون.</p>
    </div>

    <div id="audioContainer"></div>

    <script>
        const freqSlider = document.getElementById('freqSlider');
        const freqInput = document.getElementById('freqInput');
        const connectBtn = document.getElementById('connectBtn');
        const peersContainer = document.getElementById('peersContainer');
        const audioContainer = document.getElementById('audioContainer');

        let peer = null;
        let myStream = null;
        let isConnected = false;
        let scanInterval = null;
        let activeConnections = new Set();

        // Sync Slider & Input
        freqSlider.oninput = () => { freqInput.value = parseFloat(freqSlider.value).toFixed(2); if(isConnected) stopAll(); };
        freqInput.onchange = () => { let v = Math.min(Math.max(parseFloat(freqInput.value)||50,10),100); freqInput.value = v.toFixed(2); freqSlider.value = v; if(isConnected) stopAll(); };

        async function startSystem() {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const freqKey = freqInput.value.replace('.', '-');
                
                // We use fixed IDs to find each other (User A and User B)
                // In this simplified version, we try to see if "user-1" or "user-2" exist on this freq
                const isUser1 = Math.random() > 0.5;
                const myRole = isUser1 ? '1' : '2';
                const peerRole = isUser1 ? '2' : '1';
                const myId = `radio-${freqKey}-${myRole}`;
                const otherId = `radio-${freqKey}-${peerRole}`;

                peer = new Peer(myId, { debug: 1 });

                peer.on('open', (id) => {
                    isConnected = true;
                    updateUIStatus("متصل أونلاين", "text-green-400", "bg-green-500 shadow-[0_0_10px_green]");
                    document.getElementById('activeList').classList.remove('hidden');
                    
                    // Periodic Scanner: Try to call the other user every 3 seconds
                    scanInterval = setInterval(() => {
                        if (!activeConnections.has(otherId)) {
                            console.log("Scanning for friend:", otherId);
                            const call = peer.call(otherId, myStream);
                            if (call) handleCall(call);
                        }
                    }, 3000);
                });

                peer.on('call', (call) => {
                    call.answer(myStream);
                    handleCall(call);
                });

                peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') {
                        // If ID taken, try the other role
                        stopAll();
                        setTimeout(() => {
                            // Logic to flip role would go here, for now just restart
                            alert("التردد مشغول أو هناك تداخل، حاول مجدداً");
                        }, 500);
                    }
                });

            } catch (err) {
                alert("خطأ: الميكروفون غير مفعل.");
                stopAll();
            }
        }

        function handleCall(call) {
            call.on('stream', (stream) => {
                if (!document.getElementById('aud-' + call.peer)) {
                    const audio = document.createElement('audio');
                    audio.id = 'aud-' + call.peer;
                    audio.srcObject = stream;
                    audio.autoplay = true;
                    audioContainer.appendChild(audio);
                    
                    activeConnections.add(call.peer);
                    renderPeers();
                }
            });
            call.on('close', () => {
                activeConnections.delete(call.peer);
                renderPeers();
            });
        }

        function renderPeers() {
            peersContainer.innerHTML = '';
            activeConnections.forEach(id => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between bg-slate-700/50 p-3 rounded-xl border border-cyan-500/30";
                div.innerHTML = `<div class="flex items-center gap-2"><div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div><span class="text-xs">صديق متصل الآن</span></div><i class="fas fa-volume-up text-cyan-400 text-xs"></i>`;
                peersContainer.appendChild(div);
            });
        }

        function updateUIStatus(txt, cls, dot) {
            document.getElementById('statusText').innerText = txt;
            document.getElementById('statusText').className = cls;
            document.getElementById('statusDot').className = `w-2 h-2 rounded-full ${dot}`;
        }

        function stopAll() {
            if(scanInterval) clearInterval(scanInterval);
            if(peer) peer.destroy();
            if(myStream) myStream.getTracks().forEach(t => t.stop());
            isConnected = false;
            activeConnections.clear();
            document.getElementById('connectText').innerText = "دخول التردد الآن";
            connectBtn.classList.replace('bg-red-900', 'bg-cyan-600');
            updateUIStatus("غير متصل", "text-slate-500", "bg-slate-500");
            document.getElementById('activeList').classList.add('hidden');
            audioContainer.innerHTML = '';
        }

        connectBtn.onclick = () => {
            if(!isConnected) {
                connectBtn.classList.replace('bg-cyan-600', 'bg-red-900');
                document.getElementById('connectText').innerText = "مغادرة التردد";
                startSystem();
            } else {
                stopAll();
            }
        };
    </script>
</body>
</html>
