<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصال التردد اللاسلكي - Online Walkie Talkie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .frequency-display {
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
            font-family: 'Courier New', Courier, monospace;
        }
        .status-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .dial-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            background: #22d3ee;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.8);
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-8 shadow-2xl border border-slate-700 relative overflow-hidden">
        <!-- Background Glow -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl"></div>
        
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-cyan-400 mb-2">راديو الشبكة المباشر</h1>
            <p class="text-slate-400 text-sm">أدخل التردد للتحدث مع الآخرين</p>
        </header>

        <!-- Frequency Screen -->
        <div class="bg-black/40 rounded-2xl p-6 border border-slate-600 mb-8 text-center">
            <div class="text-xs text-cyan-500 mb-1 font-bold uppercase tracking-widest">Frequency MHz</div>
            <div class="flex items-center justify-center gap-2">
                <input type="number" id="freqInput" step="0.01" min="10" max="100" value="50.00" 
                       class="bg-transparent text-5xl font-bold frequency-display text-cyan-400 w-40 text-center outline-none border-b border-transparent focus:border-cyan-500/30 transition-all">
            </div>
            <div id="connectionStatus" class="mt-4 text-xs text-slate-500 flex items-center justify-center gap-2">
                <span id="statusDot" class="w-2 h-2 bg-slate-500 rounded-full"></span>
                <span id="statusText">غير متصل</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="space-y-6">
            <div>
                <input type="range" id="freqSlider" min="10" max="100" step="0.01" value="50.00" 
                       class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer dial-range">
                <div class="flex justify-between text-[10px] text-slate-500 mt-2 px-1 font-mono">
                    <span>10.00 MHz</span>
                    <span>100.00 MHz</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button id="connectBtn" class="bg-cyan-600 hover:bg-cyan-500 transition-colors py-4 rounded-xl font-bold flex flex-col items-center gap-1 shadow-lg shadow-cyan-900/20">
                    <i class="fas fa-tower-broadcast" id="connectIcon"></i>
                    <span id="connectText">دخول التردد</span>
                </button>
                <button id="micBtn" disabled class="bg-slate-700 text-slate-500 py-4 rounded-xl font-bold flex flex-col items-center gap-1 cursor-not-allowed">
                    <i id="micIcon" class="fas fa-microphone-slash"></i>
                    <span id="micText">الميكروفون مغلق</span>
                </button>
            </div>
        </div>

        <!-- Participants Info -->
        <div id="activeList" class="mt-8 pt-6 border-t border-slate-700 hidden">
            <h3 class="text-xs font-bold text-slate-500 mb-4 uppercase">المتصلون بنفس التردد:</h3>
            <div id="peersContainer" class="space-y-2">
                <!-- Peers will appear here -->
            </div>
        </div>
    </div>

    <div class="mt-8 max-w-md text-center text-slate-500 text-sm">
        <p><i class="fas fa-keyboard ml-1"></i> يمكنك كتابة التردد مباشرة بالضغط على الأرقام.</p>
        <p class="mt-1 text-[11px]">ملاحظة: لضمان الخصوصية، استخدم ترددات معقدة (مثل 77.42).</p>
    </div>

    <div id="audioContainer"></div>

    <script>
        const freqSlider = document.getElementById('freqSlider');
        const freqInput = document.getElementById('freqInput');
        const connectBtn = document.getElementById('connectBtn');
        const micBtn = document.getElementById('micBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const activeList = document.getElementById('activeList');
        const peersContainer = document.getElementById('peersContainer');
        const audioContainer = document.getElementById('audioContainer');

        let peer = null;
        let myStream = null;
        let isConnected = false;

        // Sync Slider and Input
        freqSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value).toFixed(2);
            freqInput.value = val;
            if (isConnected) disconnect();
        });

        freqInput.addEventListener('change', (e) => {
            let val = parseFloat(e.target.value);
            if (isNaN(val)) val = 50.00;
            if (val < 10) val = 10.00;
            if (val > 100) val = 100.00;
            
            const formatted = val.toFixed(2);
            freqInput.value = formatted;
            freqSlider.value = formatted;
            if (isConnected) disconnect();
        });

        async function initCall() {
            try {
                const currentFreq = freqInput.value;
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                updateStatus("جاري البحث عن رفقاء...", "text-cyan-400", "bg-cyan-400 animate-pulse");
                
                // PeerJS Config: Using public servers for demo
                // Each user on the same frequency gets a specific prefix
                const myId = 'wt-' + currentFreq.replace('.', '-') + '-' + Math.floor(Math.random() * 10000);
                peer = new Peer(myId);

                peer.on('open', (id) => {
                    console.log('My ID:', id);
                    updateStatus("متصل بالتردد: " + currentFreq, "text-green-400", "bg-green-400 status-pulse");
                    setupMicUI(true);
                    activeList.classList.remove('hidden');
                    
                    // Logic to find others: 
                    // In a real production app, you'd fetch a list from a DB.
                    // Here, we'll listen for incoming calls and also try to "ping" potential IDs (Simplified)
                });

                peer.on('call', (call) => {
                    call.answer(myStream);
                    handleStream(call);
                });

                peer.on('error', (err) => {
                    console.error('Peer Error:', err);
                    if(err.type === 'browser-incompatible') alert('متصفحك لا يدعم هذه الميزة.');
                });

            } catch (err) {
                console.error('Media Error:', err);
                alert('خطأ: الميكروفون مطلوب للعمل.');
                disconnect();
            }
        }

        function handleStream(call) {
            call.on('stream', (remoteStream) => {
                if (!document.getElementById('audio-' + call.peer)) {
                    const audio = document.createElement('audio');
                    audio.id = 'audio-' + call.peer;
                    audio.srcObject = remoteStream;
                    audio.autoplay = true;
                    audioContainer.appendChild(audio);
                    addPeerUI(call.peer);
                }
            });
            
            call.on('close', () => removePeerUI(call.peer));
        }

        function addPeerUI(id) {
            if (document.getElementById('ui-' + id)) return;
            const div = document.createElement('div');
            div.id = 'ui-' + id;
            div.className = 'flex items-center justify-between bg-slate-700/50 p-3 rounded-lg border border-slate-600 animate-fade-in';
            div.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-cyan-900 rounded-full flex items-center justify-center text-cyan-400">
                        <i class="fas fa-user text-xs"></i>
                    </div>
                    <span class="text-xs font-mono">مستخدم-${id.split('-').pop()}</span>
                </div>
                <span class="text-[10px] text-green-500 flex items-center gap-1">
                    <i class="fas fa-signal"></i> مباشر
                </span>
            `;
            peersContainer.appendChild(div);
        }

        function removePeerUI(id) {
            const el = document.getElementById('ui-' + id);
            const aud = document.getElementById('audio-' + id);
            if (el) el.remove();
            if (aud) aud.remove();
        }

        function setupMicUI(enabled) {
            if (enabled) {
                micBtn.disabled = false;
                micBtn.classList.replace('bg-slate-700', 'bg-cyan-600');
                micBtn.classList.replace('text-slate-500', 'text-white');
                micBtn.classList.remove('cursor-not-allowed');
                document.getElementById('micIcon').className = 'fas fa-microphone';
                document.getElementById('micText').innerText = 'الميكروفون يعمل';
            } else {
                micBtn.disabled = true;
                micBtn.className = "bg-slate-700 text-slate-500 py-4 rounded-xl font-bold flex flex-col items-center gap-1 cursor-not-allowed";
                document.getElementById('micIcon').className = 'fas fa-microphone-slash';
                document.getElementById('micText').innerText = 'الميكروفون مغلق';
            }
        }

        function updateStatus(text, colorClass, dotClass) {
            document.getElementById('statusText').innerText = text;
            document.getElementById('statusText').className = colorClass;
            document.getElementById('statusDot').className = `w-2 h-2 ${dotClass} rounded-full`;
        }

        function disconnect() {
            if (peer) {
                peer.destroy();
                peer = null;
            }
            if (myStream) {
                myStream.getTracks().forEach(t => t.stop());
                myStream = null;
            }
            isConnected = false;
            document.getElementById('connectText').innerText = 'دخول التردد';
            document.getElementById('connectIcon').className = 'fas fa-tower-broadcast';
            connectBtn.classList.replace('bg-red-900', 'bg-cyan-600');
            updateStatus("غير متصل", "text-slate-500", "bg-slate-500");
            activeList.classList.add('hidden');
            peersContainer.innerHTML = '';
            audioContainer.innerHTML = '';
            setupMicUI(false);
        }

        connectBtn.addEventListener('click', () => {
            if (!isConnected) {
                isConnected = true;
                document.getElementById('connectText').innerText = 'خروج';
                document.getElementById('connectIcon').className = 'fas fa-sign-out-alt';
                connectBtn.classList.replace('bg-cyan-600', 'bg-red-900');
                initCall();
            } else {
                disconnect();
            }
        });
    </script>
</body>
</html>
