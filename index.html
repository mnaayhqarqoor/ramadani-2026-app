<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصال التردد اللاسلكي - Online Walkie Talkie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .frequency-display {
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.5);
            font-family: 'Courier New', Courier, monospace;
        }
        .status-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .dial-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            background: #22d3ee;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.8);
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-8 shadow-2xl border border-slate-700 relative overflow-hidden">
        <!-- Background Glow -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl"></div>
        
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-cyan-400 mb-2">راديو الشبكة المباشر</h1>
            <p class="text-slate-400 text-sm">أدخل التردد للتحدث مع الآخرين</p>
        </header>

        <!-- Frequency Screen -->
        <div class="bg-black/40 rounded-2xl p-6 border border-slate-600 mb-8 text-center">
            <div class="text-xs text-cyan-500 mb-1 font-bold uppercase tracking-widest">Frequency MHz</div>
            <div class="flex items-center justify-center gap-2">
                <input type="number" id="freqInput" step="0.01" min="10" max="100" value="50.00" 
                       class="bg-transparent text-5xl font-bold frequency-display text-cyan-400 w-40 text-center outline-none border-b border-transparent focus:border-cyan-500/30 transition-all">
            </div>
            <div id="connectionStatus" class="mt-4 text-xs text-slate-500 flex items-center justify-center gap-2">
                <span id="statusDot" class="w-2 h-2 bg-slate-500 rounded-full"></span>
                <span id="statusText">غير متصل</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="space-y-6">
            <div>
                <input type="range" id="freqSlider" min="10" max="100" step="0.01" value="50.00" 
                       class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer dial-range">
                <div class="flex justify-between text-[10px] text-slate-500 mt-2 px-1 font-mono">
                    <span>10.00 MHz</span>
                    <span>100.00 MHz</span>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-4">
                <button id="connectBtn" class="bg-cyan-600 hover:bg-cyan-500 transition-colors py-4 rounded-xl font-bold flex flex-row justify-center items-center gap-3 shadow-lg shadow-cyan-900/20">
                    <i class="fas fa-tower-broadcast text-xl" id="connectIcon"></i>
                    <span id="connectText">ابدأ الاتصال الآن</span>
                </button>
                <div id="micStatusIndicator" class="hidden text-center text-xs text-green-400 animate-pulse">
                    <i class="fas fa-microphone"></i> الميكروفون نشط الآن
                </div>
            </div>
        </div>

        <!-- Participants Info -->
        <div id="activeList" class="mt-8 pt-6 border-t border-slate-700 hidden">
            <h3 class="text-xs font-bold text-slate-500 mb-4 uppercase">المتصلون معك:</h3>
            <div id="peersContainer" class="space-y-2">
                <!-- Peers will appear here -->
            </div>
        </div>
    </div>

    <div class="mt-8 max-w-md text-center text-slate-500 text-sm">
        <p class="mb-2">لضمان سماع الصوت:</p>
        <ul class="text-[11px] space-y-1">
            <li>1. يجب على الطرفين كتابة نفس التردد تماماً.</li>
            <li>2. يجب استخدام متصفح يدعم الميكروفون (Chrome/Edge).</li>
            <li>3. تأكد من أن الرابط يبدأ بـ <strong>https://</strong>.</li>
        </ul>
    </div>

    <div id="audioContainer"></div>

    <script>
        const freqSlider = document.getElementById('freqSlider');
        const freqInput = document.getElementById('freqInput');
        const connectBtn = document.getElementById('connectBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const activeList = document.getElementById('activeList');
        const peersContainer = document.getElementById('peersContainer');
        const audioContainer = document.getElementById('audioContainer');
        const micStatusIndicator = document.getElementById('micStatusIndicator');

        let peer = null;
        let myStream = null;
        let isConnected = false;
        let peerPrefix = "radio-freq-";

        // Sync UI
        freqSlider.addEventListener('input', (e) => {
            freqInput.value = parseFloat(e.target.value).toFixed(2);
            if (isConnected) disconnect();
        });

        freqInput.addEventListener('change', (e) => {
            let val = Math.min(Math.max(parseFloat(e.target.value) || 50, 10), 100);
            freqInput.value = val.toFixed(2);
            freqSlider.value = val.toFixed(2);
            if (isConnected) disconnect();
        });

        async function initCall() {
            try {
                // Ensure audio context is allowed
                if (window.AudioContext || window.webkitAudioContext) {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                }

                const currentFreq = freqInput.value.replace('.', '-');
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                updateStatus("جاري تهيئة الراديو...", "text-cyan-400", "bg-cyan-400 animate-pulse");
                
                // My ID is simple: radio-freq-[NUMBER]-[RANDOM]
                const myShortId = Math.floor(1000 + Math.random() * 9000);
                const myFullId = `${peerPrefix}${currentFreq}-${myShortId}`;
                
                peer = new Peer(myFullId, {
                    debug: 2
                });

                peer.on('open', (id) => {
                    isConnected = true;
                    updateStatus("أنت الآن أونلاين على تردد " + freqInput.value, "text-green-400", "bg-green-400 status-pulse");
                    micStatusIndicator.classList.remove('hidden');
                    activeList.classList.remove('hidden');
                    
                    // IMPORTANT: Discover others
                    // Since PeerJS doesn't have a built-in "list group", 
                    // in a production app we'd use a server. 
                    // For this hack, we tell users: "Wait for someone to join or the first one will call the second"
                    console.log("Joined as: " + id);
                });

                peer.on('call', (call) => {
                    console.log("Receiving call from: " + call.peer);
                    call.answer(myStream);
                    handleStream(call);
                });

                peer.on('error', (err) => {
                    console.error('Peer Error:', err.type);
                    if (err.type === 'unavailable-id') {
                        // Retry with different ID if conflict
                        initCall();
                    }
                });

            } catch (err) {
                alert('عذراً: يجب السماح للميكروفون بالعمل.');
                disconnect();
            }
        }

        function handleStream(call) {
            call.on('stream', (remoteStream) => {
                const existingAudio = document.getElementById('audio-' + call.peer);
                if (!existingAudio) {
                    const audio = document.createElement('audio');
                    audio.id = 'audio-' + call.peer;
                    audio.srcObject = remoteStream;
                    audio.autoplay = true;
                    // Force play for mobile
                    audio.play().catch(e => console.log("Auto-play blocked, waiting for interaction"));
                    audioContainer.appendChild(audio);
                    addPeerUI(call.peer);
                }
            });
            call.on('close', () => removePeerUI(call.peer));
        }

        function addPeerUI(id) {
            if (document.getElementById('ui-' + id)) return;
            const div = document.createElement('div');
            div.id = 'ui-' + id;
            div.className = 'flex items-center justify-between bg-slate-700/50 p-3 rounded-lg border border-slate-600';
            div.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-green-900 rounded-full flex items-center justify-center text-green-400">
                        <i class="fas fa-volume-up text-xs"></i>
                    </div>
                    <span class="text-xs font-mono">صديق متصل (${id.split('-').pop()})</span>
                </div>
                <span class="text-[10px] text-green-400">تسمع الآن..</span>
            `;
            peersContainer.appendChild(div);
        }

        function removePeerUI(id) {
            const el = document.getElementById('ui-' + id);
            if (el) el.remove();
            const aud = document.getElementById('audio-' + id);
            if (aud) aud.remove();
        }

        function updateStatus(text, colorClass, dotClass) {
            document.getElementById('statusText').innerText = text;
            document.getElementById('statusText').className = colorClass;
            document.getElementById('statusDot').className = `w-2 h-2 ${dotClass} rounded-full`;
        }

        function disconnect() {
            if (peer) peer.destroy();
            if (myStream) myStream.getTracks().forEach(t => t.stop());
            isConnected = false;
            connectBtn.classList.replace('bg-red-900', 'bg-cyan-600');
            document.getElementById('connectText').innerText = 'ابدأ الاتصال الآن';
            updateStatus("غير متصل", "text-slate-500", "bg-slate-500");
            activeList.classList.add('hidden');
            micStatusIndicator.classList.add('hidden');
            peersContainer.innerHTML = '';
            audioContainer.innerHTML = '';
        }

        connectBtn.addEventListener('click', () => {
            if (!isConnected) {
                connectBtn.classList.replace('bg-cyan-600', 'bg-red-900');
                document.getElementById('connectText').innerText = 'إنهاء الاتصال';
                initCall();
            } else {
                disconnect();
            }
        });
    </script>
</body>
</html>
